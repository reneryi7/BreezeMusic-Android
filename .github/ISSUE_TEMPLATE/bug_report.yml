name: Bug 反馈 (Bug Report)
description: 反馈应用崩溃、界面异常、播放/音效问题或功能错误
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交反馈！请尽量填写以下信息以便快速定位问题。提交前请确认未泄露个人账号 Token、手机号或短信验证码等隐私信息。

  - type: input
    id: app_version
    attributes:
      label: 客户端版本
      description: 可在「设置 → 关于微风音乐」（或车机版极简设置底部）中查看
      placeholder: 例如：v1.5.1 (Build 17)
    validations:
      required: true

  - type: dropdown
    id: build_variant
    attributes:
      label: 安装包变体 / 来源
      options:
        - 手机版 (BreezeMusic-phone / com.concept.music)
        - 平板版 (BreezeMusic-tablet / com.concept.music.tablet)
        - 车机独立版 (BreezeMusic-car / com.concept.music.car)
        - 从源码自行构建
    validations:
      required: true

  - type: input
    id: device_and_os
    attributes:
      label: 设备型号与 Android / 系统版本
      placeholder: 例如：小米 14 / HyperOS 2.0 (Android 15) 或 OPPO Pad / ColorOS 15
    validations:
      required: true

  - type: dropdown
    id: module_area
    attributes:
      label: 涉及的功能模块（可选）
      options:
        - 不确定 / 全局问题
        - 音频播放、音质解析与缓存
        - 64-bit DSP 调音台 / 10 段参量均衡 (PEQ)
        - 沉浸播放页 / 动态背景 / KRC 歌词 / 桌面歌词
        - 发现页 / 榜单 / 音乐库 / 歌单同步 / 搜索
        - 账号登录 / 安全验证弹窗 / 多账号切换
        - 酷狗分享口令与链接解析
        - 平板分屏 / 横竖屏自适应 / 界面动效
        - 通知栏控制 / 桌面小组件 / 耳机线控
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请描述触发该问题的具体操作路径
      placeholder: |
        1. 打开微风音乐，进入「...」页面
        2. 点击「...」按钮或播放歌曲「...」
        3. 观察到异常现象...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: 期望行为与实际现象
      placeholder: |
        - 期望行为：...
        - 实际现象：...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图、Toast 提示或补充信息（可选）
      description: 可直接拖拽截图到此处，或补充音频输出设备（手机扬声器 / 有线耳机 / 蓝牙耳机）及网络环境
    validations:
      required: false
